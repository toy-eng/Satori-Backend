databases:
  - name: survey-system-db
    databaseName: survey_system
    user: survey_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: survey-system-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/v1/health
    # Building here also applies any pending Prisma migrations before the
    # new version is released.
    buildCommand: npm ci --include=dev && npm run build && npm run prisma:deploy
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: survey-system-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated list of allowed browser origins.
      - key: CORS_ORIGINS
        value: https://satori-inky.vercel.app,http://localhost:5173
