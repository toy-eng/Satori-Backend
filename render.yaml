databases:
  - name: survey-system-db
    databaseName: survey_system
    user: survey_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: survey-system-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/v1/health
    # Compile TypeScript. dev deps are required because tsc lives there.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run at boot so they always execute where the database is
    # reachable, instead of depending on build-time network access.
    startCommand: npm run prisma:deploy && npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: survey-system-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated list of allowed browser origins.
      - key: CORS_ORIGINS
        value: https://satori-inky.vercel.app,http://localhost:5173
